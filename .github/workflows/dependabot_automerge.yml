name: Dependabot auto-merge

on:
  workflow_dispatch:
  pull_request_target:

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    uses: gofiber/.github/.github/workflows/dependabot-automerge.yml@main
    with:
      # Package has to be in here: it is the check that dependabot-dist.yml
      # turns green, and without waiting for it the merge can win the race
      # against the rebuild and land a stale bundle on main.
      match_pattern: '^Test|^Build|^Lint |^Package|^Multi Labeler|^actionlint /'
      required_checks: |
        npm: ^Test|^Build|^Lint \[|^Package
        github-actions: ^Test|^Build|^Lint \[|^Package|^actionlint /
    secrets:
      github-token: ${{ secrets.PR_TOKEN }}
